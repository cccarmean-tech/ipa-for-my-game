name: Build MonkeRAM IPA for Sideloadly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project MonkeRAM.xcodeproj \
            -scheme MonkeRAM \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA for Sideloadly
        run: |
          set -euo pipefail
          APP_PATH='build/Build/Products/Release-iphoneos/MonkeRAM.app'
          test -d "$APP_PATH"
          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/MonkeRAM.app
          (cd package && /usr/bin/zip -qry ../MonkeRAM-Sideloadly.ipa Payload)
          test -s MonkeRAM-Sideloadly.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonkeRAM-Sideloadly-IPA
          path: MonkeRAM-Sideloadly.ipa
          if-no-files-found: error
          retention-days: 7
